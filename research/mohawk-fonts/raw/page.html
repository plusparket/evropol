		<script type="text/javascript">
			(function () {
				// OneTrust banner + Preference Center inject h2/h3/h4 headings that SEO crawlers
				// (Ahrefs, Screaming Frog) count as page headings. Demote them to role="heading"
				// so they drop out of heading audits while staying accessible to screen readers.
				function demoteOneTrustHeadings() {
					var roots = document.querySelectorAll(
						'#onetrust-banner-sdk, #onetrust-pc-sdk, #ot-sdk-cookie-policy'
					);
					Array.prototype.forEach.call(roots, function (root) {
						var headings = root.querySelectorAll('h1, h2, h3, h4, h5, h6');
						Array.prototype.forEach.call(headings, function (h) {
							var div = document.createElement('div');
							div.setAttribute('role', 'heading');
							div.setAttribute('aria-level', h.tagName.charAt(1));
							for (var i = 0; i < h.attributes.length; i++) {
								div.setAttribute(h.attributes[i].name, h.attributes[i].value);
							}
							while (h.firstChild) {
								div.appendChild(h.firstChild);
							}
							h.parentNode.replaceChild(div, h);
						});
					});
				}
				function OptanonWrapper() {
					demoteOneTrustHeadings();
				}
				window.OptanonWrapper = OptanonWrapper;
				// OneTrust re-renders the Preference Center when opened, so re-run on DOM changes.
				if (typeof MutationObserver !== 'undefined') {
					new MutationObserver(function () {
						demoteOneTrustHeadings();
					}).observe(document.documentElement, {
						childList: true,
						subtree: true,
					});
				}
			})();
